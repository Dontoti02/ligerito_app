name: ligerito
description: "Ligerito — Tu pedido, al toque. Marketplace de delivery local."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Modelos
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Navegación
  go_router: ^14.8.1
  # HTTP
  dio: ^5.7.0
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # Notificaciones
  flutter_local_notifications: ^17.2.4
  # Mapas
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  # Imágenes
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # Tipografía
  google_fonts: ^6.2.1
  # i18n / formato
  intl: ^0.20.1
  # Abrir apps externas (WhatsApp, sección 8.4). Justificación: la tabla de la
  # sección 2 del Prompt Maestro no cubre abrir URLs/apps externas; url_launcher
  # es el paquete oficial de Flutter para ello. Ver plan Task 7.1.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#E63946"
  adaptive_icon_foreground: "assets/icon.png"
